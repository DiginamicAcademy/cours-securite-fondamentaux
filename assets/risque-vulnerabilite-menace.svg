<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 526" width="860" height="526" role="img" aria-label="Le chapeau de risque : la menace rencontre une vulnérabilité, le risque se réalise en impact, et sous chaque maillon le levier d'action correspondant">
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b5b8d"/>
    </marker>
  </defs>
  <style>
    .titre { font-family: DejaVu Sans, Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #1f2937; text-anchor: middle; }
    .sous { font-family: DejaVu Sans, Arial, sans-serif; font-size: 15px; fill: #4b5563; text-anchor: middle; }
    .lien { stroke: #3b5b8d; stroke-width: 2.5; fill: none; marker-end: url(#fleche); }
    .levier { font-family: DejaVu Sans, Arial, sans-serif; font-size: 12px; fill: #1f3f6b; text-anchor: middle; }
    .levier-titre { font-family: DejaVu Sans, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1f2937; text-anchor: middle; }
    .levier-vert { font-family: DejaVu Sans, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #2f7d4f; text-anchor: middle; }
  </style>

  <!-- Menace -->
  <rect x="40" y="30" width="280" height="90" rx="12" fill="#eef2f9" stroke="#3b5b8d" stroke-width="2"/>
  <text class="titre" x="180" y="68">Menace</text>
  <text class="sous" x="180" y="98">ce qui peut causer un dommage</text>

  <!-- Vulnérabilité -->
  <rect x="540" y="30" width="280" height="90" rx="12" fill="#eef2f9" stroke="#3b5b8d" stroke-width="2"/>
  <text class="titre" x="680" y="68">Vulnérabilité</text>
  <text class="sous" x="680" y="98">la faiblesse exploitable</text>

  <!-- Risque -->
  <rect x="290" y="180" width="280" height="90" rx="12" fill="#dbe6f5" stroke="#1f3f6b" stroke-width="2.5"/>
  <text class="titre" x="430" y="218">Risque</text>
  <text class="sous" x="430" y="248">probabilité × gravité</text>

  <!-- Impact -->
  <rect x="290" y="310" width="280" height="70" rx="12" fill="#fde8e8" stroke="#b34040" stroke-width="2.5"/>
  <text class="titre" x="430" y="353">Impact</text>

  <!-- Liens -->
  <path class="lien" d="M 180 120 L 180 150 L 350 150 L 350 176"/>
  <path class="lien" d="M 680 120 L 680 150 L 510 150 L 510 176"/>
  <path class="lien" d="M 430 270 L 430 306"/>

  <!-- Légende de lecture -->
  <text class="sous" x="430" y="30">la menace rencontre la vulnérabilité</text>

  <!-- Leviers d'action -->
  <text class="sous" x="430" y="396">Où agir</text>

  <rect x="20" y="404" width="260" height="92" rx="10" fill="#eef2f9" stroke="#3b5b8d" stroke-width="2"/>
  <text class="levier-titre" x="150" y="428">Menace</text>
  <text class="levier" x="150" y="452">on ne traite pas</text>
  <line x1="98" y1="448" x2="202" y2="448" stroke="#b34040" stroke-width="1.5"/>
  <text class="levier" x="150" y="470">empêcher un robot d'exister</text>
  <text class="levier" x="150" y="488">n'est pas possible</text>

  <rect x="300" y="404" width="260" height="92" rx="10" fill="#f3faf5" stroke="#2f7d4f" stroke-width="2"/>
  <text class="levier-vert" x="430" y="428">Vulnérabilité</text>
  <text class="levier" x="430" y="452">on traite</text>
  <text class="levier" x="430" y="470">refermer le compartiment</text>

  <rect x="580" y="404" width="260" height="92" rx="10" fill="#f3faf5" stroke="#2f7d4f" stroke-width="2"/>
  <text class="levier-vert" x="710" y="428">Impact</text>
  <text class="levier" x="710" y="452">on réduit</text>
  <text class="levier" x="710" y="470">chiffrer les exports,</text>
  <text class="levier" x="710" y="488">minimiser les données</text>

  <text class="sous" x="430" y="516">le risque se réalise : c'est l'impact</text>
</svg>
